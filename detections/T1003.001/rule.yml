title: LSASS Memory Access
id: 3c9657c6-c9bc-4993-80e9-b63309a45657
status: experimental
description: Detects suspicious process accessing LSASS memory (credential dumping).
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Threat Researcher
date: 2026-09-30
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1010'
    condition: selection
falsepositives:
    - Legitimate security tools like antivirus.
level: high
tags:
    - attack.credential_access
    - attack.t1003.001
